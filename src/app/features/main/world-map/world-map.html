<section class="world-map-page">
    <header class="world-map-page__header">
        <h1 class="world-map-page__heading">{{ i18n.text.worldMap }}</h1>
        <div class="world-map__controls" [attr.aria-label]="i18n.text.mapControls">
            <button
                class="world-map__button"
                type="button"
                [attr.aria-label]="i18n.text.zoomOut"
                [attr.data-tooltip]="i18n.text.zoomOut"
                [disabled]="zoom <= minZoom"
                (click)="zoomOut()"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12h14" />
                </svg>
            </button>
            <button
                class="world-map__button"
                type="button"
                [attr.aria-label]="i18n.text.zoomIn"
                [attr.data-tooltip]="i18n.text.zoomIn"
                [disabled]="zoom >= 3"
                (click)="zoomIn()"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5v14M5 12h14" />
                </svg>
            </button>
            <button
                class="world-map__button world-map__button--reset"
                type="button"
                [attr.aria-label]="i18n.text.resetMapView"
                [attr.data-tooltip]="i18n.text.resetMapView"
                [disabled]="zoom === 1"
                (click)="resetView()"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 11a8 8 0 1 1 2.3 5.7M4 5v6h6" />
                </svg>
            </button>
        </div>
    </header>
    <div class="world-map-page__stage">
        <div class="world-map-page__frame">
            <div
                class="world-map__viewport"
                [class.world-map__viewport--draggable]="canPan"
                [class.world-map__viewport--dragging]="isDragging"
                [attr.aria-label]="i18n.text.worldMap"
                role="region"
                (wheel)="onWheel($event)"
                (pointerdown)="startDragging($event)"
                (pointermove)="drag($event)"
                (pointerup)="stopDragging()"
                (pointercancel)="stopDragging()"
                (lostpointercapture)="stopDragging()"
            >
                <div class="world-map__surface" [style.transform]="mapTransform">
                    <img
                        class="world-map__image"
                        src="/assets/world-map.jpg"
                        [alt]="i18n.text.worldMap"
                        draggable="false"
                    />
                    <div class="world-map__overlay">
                        @if (playerPosition; as player) {
                            <div
                                class="world-map__player"
                                [style.left.%]="player.x"
                                [style.top.%]="player.y"
                                [attr.aria-label]="player.name"
                                [title]="player.name"
                                role="img"
                            >
                                <span class="world-map__player-marker" aria-hidden="true"></span>
                            </div>
                        }
                        @for (position of positionedAreas; track position.area.id) {
                            <button
                                class="world-map__area"
                                [class.world-map__area--city]="
                                    getAreaMarkerClass(position.area) === 'world-map__area--city'
                                "
                                [class.world-map__area--medium]="
                                    getAreaMarkerClass(position.area) === 'world-map__area--medium'
                                "
                                [class.world-map__area--small]="
                                    getAreaMarkerClass(position.area) === 'world-map__area--small'
                                "
                                [class.world-map__area--available]="
                                    worldMapData.isAreaReachable(position.area.id)
                                "
                                type="button"
                                [style.left.%]="position.x"
                                [style.top.%]="position.y"
                                [attr.aria-label]="position.area.name"
                                [title]="position.area.name"
                                (pointerdown)="$event.stopPropagation()"
                                (click)="onAreaClick(position.area)"
                            ></button>
                        }
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
