<form #registerForm="ngForm" class="register-form" novalidate (ngSubmit)="submit(registerForm)">
    <div class="form-field">
        <label for="register-username">{{ i18n.text.loginLabel }}</label>
        <input
            id="register-username"
            name="username"
            type="text"
            autocomplete="username"
            [placeholder]="i18n.text.registerUsernamePlaceholder"
            required
            ngModel
            #username="ngModel"
            [attr.aria-invalid]="submitted && username.invalid"
            [attr.aria-describedby]="
                submitted && username.invalid ? 'register-username-error' : null
            "
        />
        @if (submitted && username.invalid) {
            <span class="form-field__error" id="register-username-error" role="alert">
                {{ i18n.text.requiredField }}
            </span>
        }
    </div>

    <div class="form-field">
        <label for="register-password">{{ i18n.text.passwordLabel }}</label>
        <input
            id="register-password"
            name="password"
            type="password"
            autocomplete="new-password"
            [placeholder]="i18n.text.registerPasswordPlaceholder"
            required
            ngModel
            #password="ngModel"
            [attr.aria-invalid]="submitted && password.invalid"
            [attr.aria-describedby]="
                submitted && password.invalid ? 'register-password-error' : null
            "
        />
        @if (submitted && password.invalid) {
            <span class="form-field__error" id="register-password-error" role="alert">
                {{ i18n.text.requiredField }}
            </span>
        }
    </div>

    <div class="form-field">
        <label for="register-password-confirmation">{{
            i18n.text.passwordConfirmationLabel
        }}</label>
        <input
            id="register-password-confirmation"
            name="passwordConfirmation"
            type="password"
            autocomplete="new-password"
            [placeholder]="i18n.text.passwordConfirmationPlaceholder"
            required
            ngModel
            #passwordConfirmation="ngModel"
            [attr.aria-invalid]="submitted && passwordConfirmation.invalid"
            [attr.aria-describedby]="
                submitted && passwordConfirmation.invalid
                    ? 'register-password-confirmation-error'
                    : null
            "
        />
        @if (submitted && passwordConfirmation.invalid) {
            <span class="form-field__error" id="register-password-confirmation-error" role="alert">
                {{ i18n.text.requiredField }}
            </span>
        }
    </div>

    <button class="register-submit" type="submit">{{ i18n.text.registerSubmit }}</button>
</form>
